image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - diagnose
  - validate
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "us-east-1"
  TFSTATE_BUCKET: "aws-gitlab-terraform-state-12345"
  TFSTATE_KEY: "gitlab-runner-test/terraform.tfstate"

validate:
  stage: validate
  script:
    - echo "===== Terraform Version ====="
    - terraform --version
    - echo "===== AWS Region ====="
    - echo "$AWS_REGION"
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform fmt
    - terraform validate
  tags:
    - aws-gitlab-runner-demo


plan:
  stage: plan
  script:
    - echo "===== Terraform Version ====="
    - terraform --version
    - echo "===== AWS Region ====="
    - echo "$AWS_REGION"
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform version
    - terraform providers
    - terraform state list | grep -E 'grafana_bastion|openid|load_balancer'
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - aws-eks-project/tfplan
  tags:
    - aws-gitlab-runner-demo


apply:
  stage: apply
  dependencies:
    - plan
  script:
    - echo "===== Terraform Version ====="
    - terraform --version
    - echo "===== AWS Region ====="
    - echo "$AWS_REGION"
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform version
    - terraform providers
    - terraform apply -auto-approve tfplan
  when: manual
  tags:
    - aws-gitlab-runner-demo