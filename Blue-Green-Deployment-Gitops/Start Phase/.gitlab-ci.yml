# Create landing zone
image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - validate
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: "us-east-1"
  TFSTATE_BUCKET: "aws-gitlab-terraform-state-12345"
  TFSTATE_KEY: "gitlab-runner-test/terraform.tfstate"

before_script:
  - echo "===== Terraform Version ====="
  - terraform --version
  - echo "===== AWS Region ====="
  - echo "$AWS_REGION"

validate:
  stage: validate
  script:
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform fmt 
    - terraform validate
  tags:
    - terraform

plan:
  stage: plan
  script:
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform version
    - terraform providers
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - aws-eks-project/tfplan
  tags:
    - terraform

apply:
  stage: apply
  dependencies:
    - plan
  script:
    - cd aws-eks-project
    - terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TFSTATE_KEY" -backend-config="region=$AWS_REGION"
    - terraform version
    - terraform providers
    - terraform apply -auto-approve
   # - terraform apply -auto-approve tfplan
  when: manual
  tags:
    - terraform